<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafija Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="home" class="screen">
        <h1 class="logo-main">MAFIJA</h1>
        <div class="main-card">
            <label class="styled-label">IME</label>
            <input type="text" id="playerName" placeholder="Tvoje ime...">
            <button id="createBtn" class="primary-btn">KREIRAJ SOBU</button>
            
            <div class="divider-container extra-large">
                <span class="divider-text">ILI</span>
            </div>
            
            <label class="styled-label">KOD SOBE</label>
            <input type="text" id="roomInput" placeholder="Npr. AX82">
            <button id="joinBtn" class="secondary-btn">UĐI U SOBU</button>
        </div>
        <div class="signature"><span>CREATED BY</span><p>Marko Veljovic</p></div>
    </div>

    <div id="hostScreen" class="screen" style="display:none;">
        <div class="settings-card">
            <h3 class="styled-label">PODEŠAVANJE ULOGA</h3>
            <div class="control-row">
                <span>MAFIJA</span>
                <div class="stepper">
                    <button onclick="changeVal('mafija', -1)">−</button>
                    <input type="number" id="mafija" value="1" readonly>
                    <button onclick="changeVal('mafija', 1)">+</button>
                </div>
            </div>
            <div class="control-row">
                <span>DAMA</span>
                <div class="stepper">
                    <button onclick="changeVal('dama', -1)">−</button>
                    <input type="number" id="dama" value="0" readonly>
                    <button onclick="changeVal('dama', 1)">+</button>
                </div>
            </div>
            <button id="startGameBtn" class="start-btn locked" disabled>ČEKAMO IGRAČE...</button>
        </div>
        <div id="hostDisplay" class="host-container"></div>
        <ul id="playerList"></ul>
    </div>

    <div id="reveal" class="screen" style="display:none;">
        <div id="cardContainer"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
