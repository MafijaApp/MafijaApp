<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafija Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="home" class="screen">
        <h1>MAFIJA</h1>
        <input type="text" id="playerName" placeholder="Tvoje ime">
        <button id="createBtn">NAPRAVI SOBU</button>
        <p>ili</p>
        <input type="text" id="roomInput" placeholder="Kod sobe">
        <button id="joinBtn">UĐI U SOBU</button>
    </div>

    <div id="hostScreen" class="screen" style="display:none;">
        <h2>Soba: <span id="roomCodeText"></span></h2>
        <div id="setupArea">
            <div class="settings">
                <label>Mafija (1-2): <input type="number" id="mafija" value="1" min="1" max="2"></label>
                <label>Doktor (1): <input type="number" id="doktor" value="1" min="1" max="1" readonly></label>
                <label>Policajac (1): <input type="number" id="policajac" value="1" min="1" max="1" readonly></label>
                <label>Dama (0-1): <input type="number" id="dama" value="1" min="0" max="1"></label>
            </div>
            <p id="playerCountWarn" style="color: #fda4af; font-size: 0.8em; display:none;">Potrebno je više igrača za ove uloge!</p>
            <button id="startGameBtn">PODELI ROLE</button>
        </div>
        
        <div id="hostActions" style="display:none; width: 100%;">
            <button id="newGameBtn" style="background: #22c55e;">NOVA PARTIJA</button>
            <button id="endGameBtn" style="background: #475569;">NAPUSTI SVE</button>
        </div>
        
        <ul id="playerList"></ul>
    </div>

    <div id="reveal" class="screen" style="display:none;">
        <div id="cardContainer"></div>
        <button id="exitBtn" style="margin-top: 20px; background: #475569;">NAPUSTI IGRU</button>
    </div>

    <div id="roomCodeModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Kod sobe:</h3>
            <h1 id="roomCodeTextModal"></h1>
            <button id="closeModal">OK</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
