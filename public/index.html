<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mafija</title>

    <link rel="stylesheet" href="style.css">

    <!-- malo lepši font (nije obavezno ali izgleda profi) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- CREDIT -->
<h3 style="text-align:center; margin-top:10px;">Napravio Marko Veljović</h3>

<!-- ================= HOME ================= -->
<div id="home" class="screen">
    <h1>MAFIJA</h1>

    <input type="text" id="playerName" placeholder="Tvoje ime" maxlength="15">

    <button id="createBtn">NAPRAVI SOBU</button>

    <p>ili</p>

    <input type="text" id="roomInput" placeholder="Kod sobe" maxlength="5">

    <button id="joinBtn">UĐI U SOBU</button>
</div>

<!-- ================= HOST ================= -->
<div id="hostScreen" class="screen" style="display:none;">

    <h2>Soba: <span id="roomCodeText"></span></h2>

    <div class="settings">

        <label>
            Mafija:
            <input type="number" id="mafija" value="1" min="0" max="2">
        </label>

        <label>
            Doktor:
            <input type="number" id="doktor" value="1" min="0" max="1">
        </label>

        <label>
            Policajac:
            <input type="number" id="policajac" value="1" min="0" max="1">
        </label>

        <label>
            Dama:
            <input type="number" id="dama" value="1" min="0" max="1">
        </label>

    </div>

    <button id="startGameBtn">PODELI ROLE</button>
    <button id="newGameBtn">NOVA IGRA</button>

    <h3>Igrači:</h3>
    <ul id="playerList"></ul>

</div>

<!-- ================= ROLE SCREEN ================= -->
<div id="reveal" class="screen" style="display:none;">
    <div id="cardContainer"></div>
</div>

<!-- ================= ROOM CODE MODAL ================= -->
<div id="roomCodeModal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>Kod sobe:</h3>
        <h1 id="roomCodeTextModal"></h1>

        <p>Podeli kod igračima</p>

        <button id="closeModal">OK</button>
    </div>
</div>

<!-- ================= SOCKET ================= -->
<script src="/socket.io/socket.io.js"></script>

<!-- ================= CLIENT ================= -->
<script src="client.js"></script>

</body>
</html>
