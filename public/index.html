<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafija Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- POČETNI EKRAN -->
    <div id="home" class="screen">
        <h1 class="logo">MAFIJA</h1>
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Tvoje ime">
            <button id="createBtn" class="primary-btn">NAPRAVI SOBU</button>
            <div class="divider">ILI</div>
            <input type="text" id="roomInput" placeholder="Kod sobe">
            <button id="joinBtn" class="primary-btn">UĐI U SOBU</button>
        </div>
    </div>

    <!-- HOST LOBI EKRAN -->
    <div id="hostScreen" class="screen" style="display:none;">
        <h2 class="room-title">Soba: <span id="roomCodeText"></span></h2>
        
        <div id="setupArea" class="full-width">
            <div class="settings-card">
                <h3>Podešavanje uloga</h3>
                
                <!-- Mafija Slider (1-2) -->
                <div class="setting-row">
                    <label>Mafija: <span id="mafija-val" class="bold-val">1</span></label>
                    <input type="range" id="mafija" min="1" max="2" value="1" step="1" 
                           oninput="document.getElementById('mafija-val').innerText = this.value">
                </div>

                <!-- Dama Slider (0-1) -->
                <div class="setting-row">
                    <label>Dama: <span id="dama-val" class="bold-val">1</span></label>
                    <input type="range" id="dama" min="0" max="1" value="1" step="1" 
                           oninput="document.getElementById('dama-val').innerText = this.value">
                </div>

                <!-- Fiksne uloge -->
                <div class="setting-row disabled-row">
                    <label>Doktor: <span class="bold-val">1</span></label>
                </div>
                <div class="setting-row disabled-row">
                    <label>Policajac: <span class="bold-val">1</span></label>
                </div>
            </div>
            
            <button id="startGameBtn" class="primary-btn">PODELI ROLE</button>
        </div>

        <div id="hostActions" style="display:none;" class="full-width">
            <button id="newGameBtn" class="success-btn">NOVA PARTIJA</button>
            <button id="endGameBtn" class="secondary-btn">UGASI SOBU</button>
        </div>

        <ul id="playerList"></ul>
    </div>

    <!-- EKRAN ZA OTKRIVANJE ROLE -->
    <div id="reveal" class="screen" style="display:none;">
        <div id="cardContainer"></div>
        <button id="exitBtn" class="secondary-btn">NAPUSTI IGRU</button>
    </div>

    <!-- MODAL ZA KOD SOBE -->
    <div id="roomCodeModal" class="modal" style="display:none;">
        <div class="modal-content">
            <p>Kod tvoje sobe:</p>
            <h1 id="roomCodeTextModal"></h1>
            <button id="closeModal" class="primary-btn">OK, IDI U LOBI</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
