<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafija Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="home" class="screen">
        <h1 class="logo">MAFIJA</h1>
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Tvoje ime">
            <button id="createBtn" class="primary-btn">NAPRAVI SOBU</button>
            <div class="divider">ILI</div>
            <input type="text" id="roomInput" placeholder="Kod sobe">
            <button id="joinBtn" class="primary-btn">UĐI U SOBU</button>
        </div>
    </div>

    <div id="hostScreen" class="screen" style="display:none;">
        <h2 class="room-title">Soba: <span id="roomCodeText"></span></h2>
        
        <div id="setupArea" class="settings-card">
            <h3 class="settings-title">Konfiguracija Uloga</h3>
            
            <div class="role-control">
                <div class="role-info"><span class="role-name">Mafija</span><span class="role-limit">(1-2)</span></div>
                <div class="stepper">
                    <button onclick="changeVal('mafija', -1)">−</button>
                    <input type="number" id="mafija" value="1" min="1" max="2" readonly>
                    <button onclick="changeVal('mafija', 1)">+</button>
                </div>
            </div>

            <div class="role-control">
                <div class="role-info"><span class="role-name">Dama</span><span class="role-limit">(0-1)</span></div>
                <div class="stepper">
                    <button onclick="changeVal('dama', -1)">−</button>
                    <input type="number" id="dama" value="1" min="0" max="1" readonly>
                    <button onclick="changeVal('dama', 1)">+</button>
                </div>
            </div>

            <div class="role-control disabled">
                <div class="role-info"><span class="role-name">Doktor / Policajac</span></div>
                <div class="static-val">Fiksno: 1</div>
            </div>

            <button id="startGameBtn" class="primary-btn" style="margin-top: 20px; width: 100%;">PODELI ROLE</button>
        </div>

        <ul id="playerList"></ul>
    </div>

    <div id="reveal" class="screen" style="display:none;">
        <div id="cardContainer"></div>
        <button id="exitBtn" class="secondary-btn">NAPUSTI IGRU</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
