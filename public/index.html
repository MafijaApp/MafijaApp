<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafija Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="stickyRoomHeader" class="sticky-header" style="display:none;">
        KOD SOBE: <span id="topRoomCode">----</span>
    </div>

    <div id="home" class="screen">
        <h1 class="logo-main">MAFIJA</h1>
        <div class="main-card">
            <label class="styled-label">IME</label>
            <input type="text" id="playerName" placeholder="Tvoje ime...">
            <button id="createBtn" class="primary-btn">KREIRAJ SOBU</button>
            
            <div class="divider-container" style="display:flex; align-items:center; margin:35px 0;">
                <div style="flex:1; height:1px; background:#1a1a1a;"></div>
                <span style="padding:0 20px; color:#333; font-weight:900; font-size:0.8rem;">ILI</span>
                <div style="flex:1; height:1px; background:#1a1a1a;"></div>
            </div>

            <label class="styled-label">KOD SOBE</label>
            <input type="text" id="roomInput" placeholder="Npr. AX82">
            <button id="joinBtn" class="secondary-btn">UĐI U SOBU</button>
            <button onclick="toggleRules()" class="rules-btn">UPUTSTVO ZA IGRU</button>
        </div>
    </div>

    <div id="hostScreen" class="screen" style="display:none;">
        <div class="settings-card">
            <h3 class="styled-label" style="text-align:center;">PODEŠAVANJE</h3>
            <div class="control-row">
                <span>MAFIJA</span>
                <div class="stepper">
                    <button onclick="changeVal('mafija', -1)">−</button>
                    <input type="number" id="mafija" value="1" readonly>
                    <button onclick="changeVal('mafija', 1)">+</button>
                </div>
            </div>
            <div class="control-row">
                <span>DAMA</span>
                <div class="stepper">
                    <button onclick="changeVal('dama', -1)">−</button>
                    <input type="number" id="dama" value="0" readonly>
                    <button onclick="changeVal('dama', 1)">+</button>
                </div>
            </div>
            <div style="font-size:0.65rem; color:#555; text-align:center; margin-bottom:15px; font-weight:700;">UKLJUČENI: 1 DOKTOR + 1 POLICAJAC</div>
            <button id="startGameBtn" class="start-btn locked" disabled>FALI IGRAČA</button>
        </div>

        <div id="hostDisplay" class="highlight-host"></div>
        <ul id="playerList"></ul>
        
        <button onclick="location.reload()" class="secondary-btn" style="margin-top: 20px;">NAPUSTI SOBU</button>
    </div>

    <div id="reveal" class="screen" style="display:none;">
        <div id="cardContainer"></div>
    </div>

    <div id="rulesModal" class="rules-modal">
        <div class="rules-content">
            <h3>PRAVILA IGRE</h3>
            <p><strong>NARATOR:</strong> Glavni administrator koji vodi priču.</p>
            <p><strong>MAFIJA:</strong> Eliminiše žrtve noću.</p>
            <p><strong>DOKTOR:</strong> Spasava jednu osobu noću.</p>
            <p><strong>POLICAJAC:</strong> Proverava sumnjive noću.</p>
            <button onclick="toggleRules()" class="close-rules">RAZUMEM</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
