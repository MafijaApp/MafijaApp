<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-store" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>Mafija</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h3>Napravio Marko Veljović</h3>

<div id="home" class="screen">
    <h1>MAFIJA</h1>

    <input id="playerName" placeholder="Ime">

    <button id="createBtn">NAPRAVI SOBU</button>

    <p>ili</p>

    <input id="roomInput" placeholder="Kod">
    <button id="joinBtn">UĐI</button>
</div>

<div id="hostScreen" class="screen">

    <h2>Soba: <span id="roomCodeText"></span></h2>

    <div>
        <label>Mafija: <input type="number" id="mafija" value="1" min="0" max="2"></label>
        <label>Doktor: <input type="number" id="doktor" value="1" min="0" max="1"></label>
        <label>Policajac: <input type="number" id="policajac" value="1" min="0" max="1"></label>
        <label>Dama: <input type="number" id="dama" value="1" min="0" max="1"></label>
    </div>

    <button id="startGameBtn">PODELI ROLE</button>
    <button id="newGameBtn">NOVA IGRA</button>

    <h3>ADMIN</h3>
    <ul id="adminList"></ul>

    <h3>IGRAČI</h3>
    <ul id="playerList"></ul>

</div>

<div id="reveal" class="screen">
    <div id="cardContainer"></div>
</div>

<div id="roomCodeModal" class="modal">
    <div class="modal-content">
        <h3>Kod</h3>
        <h1 id="roomCodeTextModal"></h1>
        <button id="closeModal">OK</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js?v=999"></script>

</body>
</html>
