<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafija Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="stickyRoomHeader" class="sticky-header" style="display:none;">
        KOD SOBE: <span id="topRoomCode">----</span>
    </div>

    <!-- 1. POČETNI EKRAN -->
    <div id="home" class="screen">
        <div class="logo-container">
            <h1 class="logo-main">MAFIJA</h1>
        </div>
        <div class="main-card">
            <div class="field-wrapper">
                <label>TVOJE IME</label>
                <input type="text" id="playerName" placeholder="Unesi ime...">
            </div>
            <button id="createBtn" class="primary-btn">KREIRAJ KAO HOST</button>
            
            <div class="divider-container extra-large">
                <span class="divider-line"></span>
                <span class="divider-text">ILI</span>
                <span class="divider-line"></span>
            </div>
            
            <div class="field-wrapper">
                <label>KOD SOBE</label>
                <input type="text" id="roomInput" placeholder="Npr. AX82">
            </div>
            <button id="joinBtn" class="secondary-btn">UĐI KAO IGRAČ</button>
        </div>
    </div>

    <!-- 2. LOBI I PODEŠAVANJA -->
    <div id="hostScreen" class="screen" style="display:none;">
        <div id="setupArea" class="settings-card">
            <button id="regenCodeBtn" class="regen-btn" style="display:none;" onclick="regenerateRoomCode()">NOVI KOD</button>
            <h3 class="card-subtitle">PODEŠAVANJE ULOGA</h3>
            <div class="stepper-group">
                <div class="control-row">
                    <span class="role-name">MAFIJA</span>
                    <div class="stepper">
                        <button type="button" onclick="changeVal('mafija', -1)">−</button>
                        <input type="number" id="mafija" value="1" min="1" max="10" readonly>
                        <button type="button" onclick="changeVal('mafija', 1)">+</button>
                    </div>
                </div>
                <div class="control-row">
                    <span class="role-name">DAMA</span>
                    <div class="stepper">
                        <button type="button" onclick="changeVal('dama', -1)">−</button>
                        <input type="number" id="dama" value="0" min="0" max="1" readonly>
                        <button type="button" onclick="changeVal('dama', 1)">+</button>
                    </div>
                </div>
            </div>
            <div class="important-note">HOST JE NARATOR I NE DOBIJA ULOGU.</div>
            <button id="startGameBtn" class="start-btn locked" disabled>PROVERA IGRAČA...</button>
        </div>

        <div class="players-section">
            <h3 id="listTitle">IGRAČI (BEZ HOSTA):</h3>
            <ul id="playerList"></ul>
        </div>
    </div>

    <div id="reveal" class="screen" style="display:none;">
        <div id="cardContainer"></div>
    </div>

    <!-- CENTRIRANO DUGME ZA IZLAZ NA DNU -->
    <button id="globalExitBtn" class="exit-btn-bottom" style="display:none;" onclick="confirmExit()">NAPUSTI IGRU</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
