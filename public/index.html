<div id="home" class="screen">
    <div class="header-area">
        <h1 class="logo-main">MAFIJA</h1>
    </div>
    
    <div class="main-card">
        <!-- IME -->
        <div class="input-section">
            <span class="glitch-label">KODNO IME</span>
            <input type="text" id="playerName" class="mafia-input" placeholder="UNESI IME...">
            <button id="createBtn" class="action-btn-primary">KREIRAJ SOBU</button>
        </div>

        <!-- GRAFIČKI DIVIDER -->
        <div class="separator">
            <div class="bar"></div>
            <span class="separator-text">KONTAKT</span>
            <div class="bar"></div>
        </div>

        <!-- KOD -->
        <div class="input-section">
            <span class="glitch-label">IDENTIFIKACIJA</span>
            <input type="text" id="roomInput" class="mafia-input" placeholder="UNESI KOD...">
            <button id="joinBtn" class="action-btn-secondary">PRIDRUŽI SE</button>
        </div>
        
        <button onclick="toggleRules()" class="rules-trigger">PRAVILA</button>
    </div>

    <!-- TVOJ BREND -->
    <footer class="master-brand">
        <div class="brand-line"></div>
        <div class="brand-wrap">
            <span class="brand-sub">CREATED BY</span>
            <h2 class="brand-title">MARKO VELJOVIC</h2>
            <span class="brand-loc">EST. 2026</span>
        </div>
    </footer>
</div>
