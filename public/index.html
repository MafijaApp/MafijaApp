<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafija Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-overlay"></div>

    <!-- POČETNI EKRAN -->
    <div id="home" class="screen">
        <h1 class="logo">MAFIJA</h1>
        
        <div class="main-card">
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Tvoje ime" autocomplete="off">
                <button id="createBtn" class="primary-btn">NOVA IGRA</button>
                
                <div class="divider-container">
                    <span class="divider-line"></span>
                    <span class="divider-text">ILI</span>
                    <span class="divider-line"></span>
                </div>
                
                <input type="text" id="roomInput" placeholder="Kod sobe" autocomplete="off">
                <button id="joinBtn" class="secondary-btn">UĐI U IGRU</button>
            </div>
        </div>
    </div>

    <!-- LOBI EKRAN (HOST / VODITELJ) -->
    <div id="hostScreen" class="screen" style="display:none;">
        <h2 class="room-title">Soba: <span id="roomCodeText"></span></h2>
        
        <!-- Podešavanja uloga - Vidi samo Host pre početka -->
        <div id="setupArea" class="settings-card">
            <h3 class="card-subtitle">PODEŠAVANJE ULOGA</h3>
            
            <!-- Mafija -->
            <div class="control-row">
                <div class="control-label">
                    <span class="name">Mafija</span>
                    <span class="limit">1-2 igrača</span>
                </div>
                <div class="stepper">
                    <button type="button" onclick="changeVal('mafija', -1)">−</button>
                    <input type="number" id="mafija" value="1" min="1" max="2" readonly>
                    <button type="button" onclick="changeVal('mafija', 1)">+</button>
                </div>
            </div>

            <!-- Doktor -->
            <div class="control-row">
                <div class="control-label">
                    <span class="name">Doktor</span>
                    <span class="limit">Fiksno 1</span>
                </div>
                <div class="stepper">
                    <button type="button" disabled style="opacity: 0.3;">−</button>
                    <input type="number" id="doktor" value="1" readonly>
                    <button type="button" disabled style="opacity: 0.3;">+</button>
                </div>
            </div>

            <!-- Policajac -->
            <div class="control-row">
                <div class="control-label">
                    <span class="name">Policajac</span>
                    <span class="limit">Fiksno 1</span>
                </div>
                <div class="stepper">
                    <button type="button" disabled style="opacity: 0.3;">−</button>
                    <input type="number" id="policajac" value="1" readonly>
                    <button type="button" disabled style="opacity: 0.3;">+</button>
                </div>
            </div>

            <!-- Dama -->
            <div class="control-row">
                <div class="control-label">
                    <span class="name">Dama</span>
                    <span class="limit">0-1 igrača</span>
                </div>
                <div class="stepper">
                    <button type="button" onclick="changeVal('dama', -1)">−</button>
                    <input type="number" id="dama" value="1" min="0" max="1" readonly>
                    <button type="button" onclick="changeVal('dama', 1)">+</button>
                </div>
            </div>

            <button id="startGameBtn" class="start-btn">PODELI ULOGE</button>
        </div>

        <!-- Lista igrača sa opcijom za izbacivanje (Kada krene igra) -->
        <div class="players-section">
            <h3 id="listTitle">Igrači u lobiju:</h3>
            <ul id="playerList"></ul>
        </div>

        <!-- Kontrole za hosta nakon podele -->
        <div id="hostActions" style="display:none; margin-top: 20px;">
            <button id="newGameBtn" class="primary-btn" style="background: #27ae60;">NOVA PARTIJA</button>
        </div>
    </div>

    <!-- EKRAN ZA IGRAČE (OTKRIVANJE ULOGE) -->
    <div id="reveal" class="screen" style="display:none;">
        <div id="cardContainer">
            <!-- Ovde će pisati uloga -->
        </div>
        <button id="exitBtn" class="exit-btn">NAPUSTI</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
