<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafija Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Crveno dugme za izlaz (fiksirano) -->
    <button id="globalExitBtn" class="exit-btn-fixed" style="display:none;" onclick="location.reload()">IZLAZ</button>

    <!-- 1. POČETNI EKRAN -->
    <div id="home" class="screen">
        <!-- CUSTOM LOGO DIZAJN -->
        <div class="logo-container">
            <h1 class="logo-main">MAFIJA</h1>
            <div class="logo-sub">THE UNDERWORLD</div>
        </div>

        <div class="main-card">
            <input type="text" id="playerName" placeholder="Tvoje ime">
            <button id="createBtn" class="primary-btn">NOVA IGRA</button>
            
            <div class="divider-container large-gap">
                <span class="divider-line"></span>
                <span class="divider-text">ILI</span>
                <span class="divider-line"></span>
            </div>
            
            <input type="text" id="roomInput" placeholder="Kod sobe">
            <button id="joinBtn" class="secondary-btn">UĐI U IGRU</button>
        </div>
    </div>

    <!-- 2. KARTICA SA KODOM -->
    <div id="roomCodeModal" class="screen" style="display:none;">
        <div class="main-card modal-center">
            <p class="label-text">KOD TVOJE SOBE:</p>
            <h1 id="roomCodeDisplay" class="giant-code"></h1>
            <button onclick="closeCodeModal()" class="primary-btn">OK, NASTAVI</button>
        </div>
    </div>

    <!-- 3. LOBI I PODEŠAVANJA -->
    <div id="hostScreen" class="screen" style="display:none;">
        <div id="setupArea" class="settings-card">
            <h3 class="card-subtitle">PODEŠAVANJE PARTIJE</h3>
            
            <div class="stepper-group">
                <div class="control-row">
                    <span class="role-name">MAFIJA</span>
                    <div class="stepper">
                        <button type="button" onclick="changeVal('mafija', -1)">−</button>
                        <input type="number" id="mafija" value="1" min="1" max="5" readonly>
                        <button type="button" onclick="changeVal('mafija', 1)">+</button>
                    </div>
                </div>
                <div class="control-row">
                    <span class="role-name">DAMA</span>
                    <div class="stepper">
                        <button type="button" onclick="changeVal('dama', -1)">−</button>
                        <input type="number" id="dama" value="0" min="0" max="1" readonly>
                        <button type="button" onclick="changeVal('dama', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="important-note">
                DOKTOR I POLICAJAC (1+1) SU OBAVEZNI
            </div>

            <button id="startGameBtn" class="start-btn locked" disabled>ČEKA SE DOVOLJNO IGRAČA</button>
        </div>

        <div class="players-section">
            <h3 id="listTitle">IGRAČI U LOBIJU:</h3>
            <ul id="playerList"></ul>
        </div>
    </div>

    <!-- 4. EKRAN ZA ULOGU -->
    <div id="reveal" class="screen" style="display:none;">
        <div id="cardContainer"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
