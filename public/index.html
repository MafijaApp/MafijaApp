<div id="home" class="screen">
    <h1 class="logo-main">MAFIJA</h1>
    
    <div class="main-card">
        <!-- IME SEKCIJA -->
        <div class="input-group">
            <label class="premium-label">OPERATIVAC</label>
            <input type="text" id="playerName" class="main-input" placeholder="UNESI SVOJE IME">
        </div>

        <button id="createBtn" class="primary-btn">OSNUJU PORODICU</button>

        <!-- NOVI GRAFIČKI DIVIDER -->
        <div class="heavy-divider">
            <div class="line"></div>
            <span class="or-text">ILI</span>
            <div class="line"></div>
        </div>

        <!-- KOD SEKCIJA -->
        <div class="input-group">
            <label class="premium-label">PRISTUPNI KOD</label>
            <input type="text" id="roomInput" class="main-input" placeholder="PRIDRUŽI SE EKIPI">
        </div>

        <button id="joinBtn" class="secondary-btn">UĐI U SOBU</button>
        
        <button onclick="toggleRules()" class="rules-link">PROČITAJ DOSIJE (UPUTSTVO)</button>
    </div>

    <!-- BREND KOJI IZGLEDA MOĆNO -->
    <div class="brand-footer">
        <div class="brand-line"></div>
        <div class="brand-content">
            <span class="brand-prefix">DESIGNED & DEVELOPED BY</span>
            <h2 class="brand-name">MARKO VELJOVIC</h2>
            <span class="brand-year">MMXXVI</span>
        </div>
    </div>
</div>
